<script>

function hexToRgb(hex){
  hex = hex.replace('#','');
  let a = 255;
  if(hex.length === 8){
    a = parseInt(hex.slice(6,8),16);
    hex = hex.slice(0,6);
  }
  const num = parseInt(hex,16);
  return { r:(num>>16)&255, g:(num>>8)&255, b:num&255, a:a/255 };
}
function lerp(a,b,t){ return a + (b-a)*t; }
function mixColor(c1,c2,t){
  const r = Math.round(lerp(c1.r,c2.r,t));
  const g = Math.round(lerp(c1.g,c2.g,t));
  const b = Math.round(lerp(c1.b,c2.b,t));
  const a = lerp(c1.a,c2.a,t);
  return `rgba(${r},${g},${b},${a.toFixed(2)})`;
}

const near = hexToRgb('#674d45');
const far  = hexToRgb('#a08a83c7');

const wrap = document.getElementById('phoneWrap');
const rings = 5;
const dotsPerRing = 18;
const minRadius = 62;
const maxRadius = 130;
const minSize = 5;
const maxSizeFar = 16;

for(let ring=0; ring<rings; ring++){
  const t = ring/(rings-1); // 0 = نزدیک، 1 = دور
  const radius = lerp(minRadius, maxRadius, t);
  const size = lerp(10, 4, t);
  const color = mixColor(near, far, t);
  const opMax = lerp(0.95, 0.35, t);
  const opMin = opMax * 0.35;

  for(let i=0; i<dotsPerRing; i++){
    const angle = (360/dotsPerRing) * i + (ring * 12) ;
    const rad = angle * Math.PI/180;
    const x = Math.cos(rad) * radius;
    const y = Math.sin(rad) * radius;

    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.style.setProperty('--x', x.toFixed(1)+'px');
    dot.style.setProperty('--y', y.toFixed(1)+'px');
    dot.style.width = size+'px';
    dot.style.height = size+'px';
    dot.style.setProperty('--dot-color', color);
    dot.style.setProperty('--op-max', opMax.toFixed(2));
    dot.style.setProperty('--op-min', opMin.toFixed(2));
    const delay = ((angle % 360)/360) * 2.4 + ring*0.15;
    dot.style.setProperty('--delay', (-delay).toFixed(2)+'s');
    wrap.appendChild(dot);
  }
}
</script>
