<script>
    const expireTime = {{ expire_time }};
    const timer = document.getElementById("ver_code_time");
    const btn = document.getElementById('btn-code')

    const countdown = setInterval(() => {
        const now = Date.now() / 1000;
        const timeLeft = Math.floor(expireTime - now);

        if (timeLeft <= 0) {
            clearInterval(countdown);
            btn.style = "display: flex;"
            timer.style = "display: none;"
            return;
        }

        let seconds = timeLeft;

        seconds = seconds < 10 ? "0" + seconds : seconds;

        timer.innerHTML = `${seconds}`;

    }, 1000);

    let verify_form = document.getElementById('verify_form')
    let verify_input = document.getElementById('ver-pass')
    let verify_btn = document.getElementById('btn-login')

    verify_input.addEventListener("input", () => {
        verify_input.value = verify_input.value.replace(/\D/g, "");

        if (verify_input.value.length === 6) {
            Showloader(3000)
            verify_btn.classList.add('disabled')
            verify_form.submit();
        }
    });
</script>
<script src="{% static 'scripts/main.js' %}"></script>
<script src="{% static 'scripts/verfiy.js' %}"></script>
</html>
