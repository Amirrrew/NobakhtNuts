const baseurl = '/userpanel'

let MakePanel = () => {
    let userpanelbox = document.getElementById('control')


    for(let i = 0 ;i < allOptions.length ;i++) {
        let opt = allOptions[i]
        html += `

                    <div style="display: flex; gap: 5px;">
                        <div class='${opt.desc === '' ? '' : 'mt-2'}'>${opt.icon}</div>
                        <div>
                            <div class="flex items-start gap-1">${opt.title} ${opt.new ? `<div class="p-1 bg-[var(--color5)] rounded-full mt-2"></div>` : ' '}</div>
                            <div class='text-xs text-[var(--color10)]'>${opt.desc}</div>
                        </div>
                    </div>
                    <i class="fa fa-arrow-left ${opt.desc === '' ? 'mt-1' : 'mt-3.5'}" style="opacity: 100%; font-size: 15px;"></i>
                </div>
            </a>
        `
        userpanelbox.innerHTML = html
    }
}
