<script>
    let provinceSelect= document.getElementById('select-pr')
    let citySelect = document.getElementById('select-ct')

    provinceSelect.addEventListener("change", GetCity);

    async function GetCity() {
        const response = await fetch(
            `/userpanel/get-cities/?province_id=${provinceSelect.value}`
        );

        const cities = await response.json();

        citySelect.innerHTML = '';

        cities.forEach(city => {
            citySelect.innerHTML += `
                <option value="${city.id}">
                    ${city.name}
                </option>
            `;
        });
    }

    GetCity()
</script>
