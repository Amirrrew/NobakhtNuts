{% extends 'adminpanel_module/shared/base-admin.html' %}
{% load poll_extras %}


{% block admin_title %}
    افزودن محصول جدید
{% endblock %}

{% block admin_content %}

        <div class="flex gap-1 items-start">
            <a href="{% url 'admin_product_list' %}"><button class="btn-prdcounter mt-1 text-sm pt-1 rounded-2xl"><i class="fa fa-angle-right"></i></button></a>
            <svg class="mt-[-3px] mr-2" id="Bag 2" width="35" height="35" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path fill-rule="evenodd" clip-rule="evenodd" d="M7.71924 7.1229C7.72523 4.62077 9.75766 2.5969 12.2607 2.60169C14.7624 2.60768 16.7865 4.64056 16.7812 7.14222V10.1737C16.7812 10.5879 16.4455 10.9237 16.0312 10.9237C15.617 10.9237 15.2812 10.5879 15.2812 10.1737V7.14169L15.2812 7.1399C15.2852 5.46626 13.9315 4.10589 12.2578 4.10169C10.5833 4.09868 9.2237 5.45228 9.21924 7.12564V10.1737C9.21924 10.5879 8.88345 10.9237 8.46924 10.9237C8.05502 10.9237 7.71924 10.5879 7.71924 10.1737L7.71924 7.1229Z" fill="#674d45"></path>

            </svg>
            <div class="flex gap-2 cursor-default">
                <a href="{% url 'admin_order_list' %}" class="text-4xl font-semibold">محصولات</a>
                <i class="fa fa-angle-left mt-2 text-[var(--color10)]"></i>
                <h1 class="text-2xl text-[var(--color6)] font-semibold mt-0.5">افزودن محصول جدید</h1></div>
        </div>
    </div>
    <div class="flex w-[100%] mt-2">

        <div class="w-[60%]">

            <div class="tablebox-default w-[100%]">
                <div class="flex gap-1">
                    <svg id="Info Square" width="24" height="25" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path opacity="0.4" fill-rule="evenodd" clip-rule="evenodd" d="M12.25 2.78467C5.052 2.78467 2.5 5.33667 2.5 12.5347C2.5 19.7327 5.052 22.2847 12.25 22.2847C19.448 22.2847 22 19.7327 22 12.5347C22 5.33667 19.448 2.78467 12.25 2.78467Z" fill="#674d45"></path>
                    <path d="M12.2461 9.78467H12.2551C12.6691 9.78467 13.0011 9.44867 13.0011 9.03467C13.0011 8.62067 12.6601 8.28467 12.2461 8.28467C11.8321 8.28467 11.4961 8.62067 11.4961 9.03467C11.4961 9.44867 11.8321 9.78467 12.2461 9.78467Z" fill="#674d45"></path>
                    <path d="M12.2501 17.1797C12.6641 17.1797 13.0001 16.8437 13.0001 16.4297V12.5347C13.0001 12.1207 12.6641 11.7847 12.2501 11.7847C11.8361 11.7847 11.5001 12.1207 11.5001 12.5347V16.4297C11.5001 16.8437 11.8361 17.1797 12.2501 17.1797Z" fill="#674d45"></path>
                    </svg>
                    <h1 class="text-xl font-semibold">مشخصات ابتدایی</h1>
                </div>

                <div class="editpanel-row mt-2">
                    <div class="input-icon-def1" id="">
                        <i class="fa fa-file-text text-[var(--color10)] m-4"></i>
                        <input id="title" name="title" value="{% if product.title %}{{ product.title }}{% endif %}" placeholder="عنوانی برای محصول وارد کنید">
                    </div>
                </div>
            </div>

        </div>

        <div class="w-[40%]">

        </div>
    </div>
{% endblock %}
