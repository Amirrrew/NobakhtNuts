{% load poll_extras %}



                <div class="admin-widget-small w-[50%] relative" style="animation: load8 300ms">
                    <div class="flex justify-between">
                        <div class="flex gap-1">
                            <svg class="mt-[-2px]" id="Buy" width="24" height="25" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path opacity="0.4" fill-rule="evenodd" clip-rule="evenodd" d="M6.39507 6.30158L6.09507 3.24158H2.19507V4.74158H4.73507L6.01507 17.4416H20.8351L22.3051 6.30158H6.39507Z" fill="#674d45"></path>
                            <path d="M13.8245 11.7118H17.9945V10.2118H13.8245V11.7118Z" fill="#674d45"></path>
                            <path d="M6.57983 20.5527C6.57983 19.8497 7.15083 19.2787 7.85383 19.2787C8.55583 19.2787 9.12683 19.8497 9.12683 20.5527C9.12683 21.2557 8.55583 21.8277 7.85383 21.8277C7.15083 21.8277 6.57983 21.2557 6.57983 20.5527Z" fill="#674d45"></path>
                            <path d="M17.447 20.5527C17.447 19.8497 18.018 19.2787 18.721 19.2787C19.424 19.2787 19.995 19.8497 19.995 20.5527C19.995 21.2557 19.424 21.8277 18.721 21.8277C18.018 21.8277 17.447 21.2557 17.447 20.5527Z" fill="#674d45"></path>
                            </svg>
                            <div>سفارشات امروز</div>
                        </div>
                        {% if order_difference > 0 %}
                        <div class="stat-profit mt-[-5px] stat-order">
                            <div class="stat-dot-profit"></div>
                            <div>{{ order_difference|to_fanum }} تا بیشتر</div>
                        </div>
                        {% elif order_difference < 0 %}
                        <div class="stat-loss mt-[-5px] stat-order">
                            <div class="stat-dot-loss"></div>
                            <div>{{ order_difference|to_fanum }} تا کمتر</div>
                        </div>
                        {% else %}
                            <div class="stat-static mt-[-5px] stat-order">
                            <div class="stat-dot-static"></div>
                            <div>مساوی با دیروز</div>
                        </div>
                        {% endif %}
                    </div>
                    <h1 class="text-5xl font-semibold mt-4">
                        {{ order_count_today|to_fanum }}
                    </h1>
                </div>
