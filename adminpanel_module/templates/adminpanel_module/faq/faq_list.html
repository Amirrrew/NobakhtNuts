{% extends 'adminpanel_module/shared/base-admin.html' %}
{% load poll_extras %}

{% block admin_title %}
	سوالات متداول
{% endblock %}

{% block admin_content %}
    <div class="flex justify-between p-2 pt-6 sticky mt-[-10px] top-[-10px] z-10 bg-[var(--header-bg)] backdrop-filter-[blur(10px)] rounded-xl">
        <div class="flex gap-2 items-start">
            <svg class="mt-[-3px]" id="Info Square" width="35" height="35" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path opacity="0.4" fill-rule="evenodd" clip-rule="evenodd" d="M12.25 2.78467C5.052 2.78467 2.5 5.33667 2.5 12.5347C2.5 19.7327 5.052 22.2847 12.25 22.2847C19.448 22.2847 22 19.7327 22 12.5347C22 5.33667 19.448 2.78467 12.25 2.78467Z" fill="#674d45"></path>
            <path d="M12.2461 9.78467H12.2551C12.6691 9.78467 13.0011 9.44867 13.0011 9.03467C13.0011 8.62067 12.6601 8.28467 12.2461 8.28467C11.8321 8.28467 11.4961 8.62067 11.4961 9.03467C11.4961 9.44867 11.8321 9.78467 12.2461 9.78467Z" fill="#674d45"></path>
            <path d="M12.2501 17.1797C12.6641 17.1797 13.0001 16.8437 13.0001 16.4297V12.5347C13.0001 12.1207 12.6641 11.7847 12.2501 11.7847C11.8361 11.7847 11.5001 12.1207 11.5001 12.5347V16.4297C11.5001 16.8437 11.8361 17.1797 12.2501 17.1797Z" fill="#674d45"></path>
            </svg>
            <h1 class="text-4xl font-semibold">سوالات متداول</h1>
        </div>
        <div class="flex gap-1 relative">
            <a href="{% url 'admin_faq_add' %}" class="btn-defIconFlex2 gap-2">
                <div>سوال و جواب جدید</div>
                <i class="fa fa-add mt-1"></i>
            </a>
            <button onclick="OpenFooterBoxAdd()" class="btn-defIconFlex gap-2">
                <div>دسته جدید</div>
                <i class="fa fa-add mt-1"></i>
            </button>
            <div id="footerbox-input" class="hidden gap-1 absolute p-2 mt-12 w-80 bg-[var(--header-bg)] rounded-xl border border-[var(--color12)] left-0" style="backdrop-filter: blur(10px); z-index: 100; animation: load5 300ms">
                <input id="footerbox-inp" class="input-admin bg-white" placeholder="عنوان دسته جدید">
                <button onclick="NewFooterBox()" class="btn-defIconFlex" style="width: 60px; height: 50px; display: block">
                    <i class="fa fa-check mt-1.5"></i>
                </button>
            </div>
        </div>
    </div>
    <div id="footer-link-partial" class="flex flex-wrap w-[100%] gap-2 mt-5 items-start relative">
        {% include 'adminpanel_module/faq/faq_partial.html' %}
    </div>
    <script>
        let footerboxinput = document.getElementById('footerbox-input')
        let footerbox_inp = document.getElementById('footerbox-inp')
        let footerlinkpartial = document.getElementById('footer-link-partial')
        function OpenFooterBoxAdd() {
            footerboxinput.classList.replace('hidden', 'flex');

            setTimeout(() => {
                document.addEventListener('click', (e)=> {
                    if (!footerboxinput.contains(e.target)) {
                        footerboxinput.classList.replace('flex', 'hidden');
                    }
                }, { once: true });
            }, 50);
        }

        let NewFooterBox = () => {
            footer_title = footerbox_inp.value
            Showloader(1000)
            fetch('/adminpanel/faq/addcategory/?title=' + footer_title).then(res => res.json()).then(data => {
                footerlinkpartial.innerHTML = data.html
            }).finally(()=> {
                footerbox_inp.value = ''
                footerboxinput.classList.replace('flex' ,'hidden')
            })
        }
     </script>
{% endblock %}
