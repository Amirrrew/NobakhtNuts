{% extends 'adminpanel_module/shared/base-admin.html' %}
{% load poll_extras %}

{% block admin_title %}
	بسته بندی ها
{% endblock %}

{% block admin_content %}
    <div class="flex justify-between p-2 pt-6 sticky mt-[-10px] top-[-10px] z-10 bg-[var(--header-bg)] backdrop-filter-[blur(10px)] rounded-xl">
        <div class="flex gap-2 items-start">
            <svg id="Graph" width="35" height="35" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path opacity="0.4" fill-rule="evenodd" clip-rule="evenodd" d="M15.3817 12.9724C13.9727 13.0184 12.3777 13.0684 11.6877 12.3784C10.9407 11.6304 10.8827 9.98136 10.8357 8.65536C10.7917 7.40336 10.7567 6.41336 10.2487 5.90636C9.65572 5.31336 8.66472 5.24336 7.53072 5.71136C5.17372 6.68836 2.66772 9.73336 2.66772 13.4514C2.66772 17.9724 6.34672 21.6514 10.8687 21.6514C15.2897 21.6514 17.8627 18.2854 18.6867 16.2974C19.2057 15.0454 19.2137 14.0374 18.7087 13.5344C18.0617 12.8864 16.8177 12.9284 15.3817 12.9724Z" fill="#674d45"></path>
            <path fill-rule="evenodd" clip-rule="evenodd" d="M21.7684 7.74265C21.3314 5.65665 18.6694 3.09965 16.2894 2.48065C15.1224 2.17565 14.1384 2.40365 13.5184 3.11765C12.6574 4.10965 12.3724 9.55965 13.3764 10.5637C13.7864 10.9737 14.8214 11.1477 16.0134 11.1477C17.9034 11.1477 20.1854 10.7097 20.9944 10.0737C21.6934 9.52365 21.9684 8.69565 21.7684 7.74265Z" fill="#674d45"></path>
            </svg>
            <h1 class="text-4xl font-semibold">بسته بندی ها</h1>
        </div>
        <div>
            <a href="{% url 'admin_pack_add' %}" class="btn-defIconFlex gap-2">
                <div>بسته بندی جدید</div>
                <i class="fa fa-add mt-1"></i>
            </a>
        </div>
    </div>

    <div class="flex flex-wrap items-start gap-2 mt-5">
        {% for pack in packs %}
            <div id="cat-{{ c.pk }}" class="cat-opt relative bg-[var(--color12)] rounded-xl p-2 transition-all hover:bg-[var(--color13)]" style="animation: load5 {% widthratio forloop.counter 1 50 %}ms">
                <div class="flex gap-3">
                    <div class="text-xl">
                        {{ pack.title|to_fanum }}
                    </div>
                    <div class="flex gap-1 mt-0.5">
                        <a href="{% url 'admin_pack_edit' pack.pk %}"><button class="bg-[var(--color11)] text-[var(--color6)] w-5 h-5 rounded cursor-pointer"><i class="fa fa-pencil text-xs"></i></button></a>
                        <button onclick="OpenDialog('آیا از حذف بسته {{ pack.title|to_fanum }} مطمئن هستید؟' ,'{% url 'admin_pack_delete' pack.pk %}')" class="bg-[var(--cancel-bg)] text-[var(--loss-bg)] w-5 h-5 rounded cursor-pointer"><i class="fa fa-trash text-xs"></i></button>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>


{% endblock %}
