{% extends 'adminpanel_module/shared/base-admin.html' %}
{% load poll_extras %}

{% block admin_title %}
	لیست سیاه
{% endblock %}

{% block admin_content %}
    <div class="flex justify-between p-2 pt-6 sticky mt-[-10px] top-[-10px] z-10 bg-[var(--header-bg)] backdrop-filter-[blur(10px)] rounded-xl">
        <div class="flex gap-2 items-start">
            <svg id="Paper Fail" width="35" height="35" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path opacity="0.4" fill-rule="evenodd" clip-rule="evenodd" d="M17.26 8.674C15.614 8.674 14.27 7.34 14.27 5.694V3.652L19.552 8.674H17.26ZM20.955 8.85C20.955 8.81 20.955 8.78 20.945 8.74C20.915 8.56 20.885 8.38 20.855 8.21C20.835 8.1 20.785 8.01 20.705 7.93L15.035 2.53C14.965 2.46 14.865 2.41 14.765 2.4C14.595 2.38 14.415 2.36 14.235 2.34C14.205 2.33 14.165 2.33 14.135 2.33C13.555 2.28 12.915 2.25 12.245 2.25C5.68498 2.25 3.35498 4.8 3.35498 12C3.35498 19.19 5.68498 21.75 12.245 21.75C18.815 21.75 21.145 19.19 21.145 12C21.145 10.8 21.085 9.76 20.955 8.85Z" fill="#674d45"></path>
            <path d="M13.8146 15.3371C14.1076 15.0441 14.1076 14.5701 13.8146 14.2771L12.6126 13.0741L13.8156 11.8711C14.1086 11.5781 14.1086 11.1041 13.8156 10.8111C13.5226 10.5181 13.0486 10.5181 12.7556 10.8111L11.5526 12.0141L10.3486 10.8111C10.0566 10.5181 9.5816 10.5181 9.2886 10.8111C8.9956 11.1041 8.9956 11.5781 9.2886 11.8711L10.4916 13.0741L9.2896 14.2771C8.9966 14.5701 8.9966 15.0441 9.2896 15.3371C9.4356 15.4841 9.6276 15.5571 9.8196 15.5571C10.0126 15.5571 10.2036 15.4841 10.3496 15.3371L11.5526 14.1351L12.7546 15.3371C12.9006 15.4841 13.0926 15.5571 13.2846 15.5571C13.4766 15.5571 13.6686 15.4841 13.8146 15.3371Z" fill="#674d45"></path>
            </svg>
            <h1 class="text-4xl font-semibold">لیست سیاه</h1>
        </div>
        <div class="relative flex gap-1">
            <button onclick="OpenBlackListAdd()" class="btn-defIconFlex gap-2">
                <div>شماره جدید</div>
                <i class="fa fa-add mt-1"></i>
            </button>
            <div id="phone-input" class="hidden gap-1 absolute p-2 mt-12 w-80 bg-[var(--header-bg)] rounded-xl border border-[var(--color12)] left-0" style="backdrop-filter: blur(10px); z-index: 100; animation: load5 300ms">
                <input id="phone-inp" class="input-admin bg-white" type="number" maxlength="11" placeholder="شماره تلفن">
                <button onclick="NewPhone()" class="btn-defIconFlex" style="width: 60px; height: 50px; display: block">
                    <i class="fa fa-check mt-1.5"></i>
                </button>
            </div>
        </div>
    </div>





    <div class="flex flex-wrap items-start gap-2 mt-2 mr-3" id="blacklist-partial">
        {% include 'adminpanel_module/blacklist/blacklist_partial.html' %}
    </div>
    <script>
        let phone_input = document.getElementById('phone-input')
        let phone_inp = document.getElementById('phone-inp')
        let blacklist_partial = document.getElementById('blacklist-partial')
        function OpenBlackListAdd() {
            phone_input.classList.replace('hidden', 'flex');

            setTimeout(() => {
                document.addEventListener('click', (e)=> {
                    if (!phone_input.contains(e.target)) {
                        phone_input.classList.replace('flex', 'hidden');
                    }
                }, { once: true });
            }, 50);
        }

        let NewPhone = () => {
            let black_phone = phone_inp.value
            Showloader(1000)
            fetch('/adminpanel/blacklist/?phone=' + black_phone).then(res => res.json()).then(data => {
                blacklist_partial.innerHTML = data.html
            }).finally(()=> {
                phone_inp.value = ''
                phone_input.classList.replace('flex' ,'hidden')
            })
        }
    </script>
{% endblock %}
