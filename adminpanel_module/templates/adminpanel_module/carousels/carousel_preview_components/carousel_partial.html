{% load poll_extras %}

                {% for item in special_carousel.carousel_set.all %}
                    {% with p=item.product %}
                        {% include 'product_module/include/product_card_slide.html' %}
                    {% endwith %}
                {% endfor %}
                {% if special_carousel.carousel_set.count <= 20 %}
                    <div class="swiper-slide w-[100%] bg-[var(--color12)] h-[465px] rounded-xl items-center cursor-pointer" style="display: flex; justify-content: center">
                        <div class="w-30 h-30 centerbox items-center bg-[var(--color11)] rounded-full">
                            <i class="fa fa-add fa-2x text-[var(--color10)]"></i>
                        </div>
                    </div>
                {% endif %}
