{% load poll_extras %}

                {% for item in special_carousel.carousel_set.all %}
                    {% with p=item.product %}
                        {% include 'adminpanel_module/carousels/carousel_preview_components/carousel_product_card.html' %}
                    {% endwith %}
                {% endfor %}
                {% if special_carousel.carousel_set.count <= 20 %}
                    <div onclick="Product_To_Carousel(true)" class="swiper-slide w-[100%] bg-[var(--color12)] h-[465px] rounded-xl items-center cursor-pointer" style="display: flex; justify-content: center">
                        <div class="w-30 h-30 centerbox items-center bg-[var(--color11)] rounded-full">
                            <i class="fa fa-add fa-2x text-[var(--color10)]"></i>
                        </div>
                    </div>
                {% endif %}
            <script>
                document.addEventListener('click', e => {
                    const btn = e.target.closest('.delete-carousel-item');

                    if(btn){
                        Carousel_grab_item(
                            btn.dataset.carousel,
                            btn.dataset.product,
                            'del'
                        );
                    }
                });
            </script>
