{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    {% include 'include/head_refrence.html' %}
    <title>
        ادمین خشکبار نوبخت | ورود به پنل
    </title>
</head>
<body onscroll="HeaderManage()" onload="StartIntervals(false)">
    {% include 'loader.html' %}
    {% include 'message.html' %}
    <div class="centerbox min-h-[100vh] items-center">
        <div class="form-default account-form login-register-box">
            <div class="w-[100%] mr5">
                <div class="flex gap-2 login-back">
                    <div onclick="history.back()" class="fa fa-arrow-right cursor-pointer"></div>
                </div>

                <h1 class="text-center text-4xl font-semibold">
                    ورود ادمین
                </h1>
                <form method="post" class="mt-3">
                    {% csrf_token %}
                    <div class="input-icon-def1 relative" style="animation: load 350ms">
                        <svg id="Profile" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M12.2115 11.6423H12.2425C14.9375 11.6423 17.1295 9.45026 17.1295 6.75526C17.1295 4.06126 14.9375 1.86926 12.2425 1.86926C9.5475 1.86926 7.3555 4.06126 7.3555 6.75326C7.3465 9.43926 9.5235 11.6323 12.2115 11.6423Z" fill="#674d45"></path>
                        <path opacity="0.4" fill-rule="evenodd" clip-rule="evenodd" d="M12.2503 13.8307C8.33727 13.8307 4.90527 16.1327 4.90527 18.7557C4.90527 22.1307 10.4343 22.1307 12.2503 22.1307C14.0663 22.1307 19.5943 22.1307 19.5943 18.7337C19.5943 16.1217 16.1623 13.8307 12.2503 13.8307Z" fill="#674d45"></path>
                        </svg>
                        <input onblur="PlaceHolderHandle('login-phone' ,'phone-plc' ,'bl')" onfocus="PlaceHolderHandle('login-phone' ,'phone-plc' ,'fc')" type="text" name="username" id="login-phone">
                        <div class="input-placeholder" id="phone-plc">نام کاربری خود را وارد کنید</div>
                    </div>
                    <div class="input-icon-def1 relative mt-3" style="animation: load 550ms">
                        <svg id="Lock" width="24" height="25" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path opacity="0.4" d="M9.18664 9.20312C9.2273 9.19717 9.26805 9.19162 9.30888 9.18649C9.45426 9.16821 9.64701 9.14235 9.87923 9.11013C10.5921 9.03177 11.3806 8.99463 12.2501 8.99463C18.2741 8.99463 20.4101 10.7666 20.4101 15.7656C20.4101 20.7656 18.2741 22.5376 12.2501 22.5376C6.22609 22.5376 4.09009 20.7656 4.09009 15.7656C4.09009 13.0651 4.7166 11.3089 6.23942 10.2636C6.63855 10.0183 7.65058 9.5105 8.79749 9.27221C8.92429 9.24745 9.05399 9.22443 9.18664 9.20312Z" fill="#674d45"></path>
                        <path d="M8.43872 9.34841V7.91641C8.47172 5.84241 10.1227 4.19741 12.1987 4.17041C13.2297 4.14241 14.1807 4.54241 14.9097 5.25341C15.6377 5.96441 16.0467 6.91541 16.0587 7.92441V9.3479C16.6189 9.47807 17.1175 9.64634 17.5587 9.85617V7.91541C17.5407 6.49641 16.9727 5.16941 15.9557 4.17941C14.9407 3.18941 13.5867 2.69841 12.1787 2.67041C9.28772 2.70741 6.98572 5.00141 6.93872 7.90541V9.86241L8.43872 9.34841Z" fill="#674d45"></path>
                        <path d="M12.9998 17.0477C12.9998 17.4617 12.6638 17.7977 12.2498 17.7977C11.8358 17.7977 11.4998 17.4617 11.4998 17.0477V14.8267C11.4998 14.4127 11.8358 14.0767 12.2498 14.0767C12.6638 14.0767 12.9998 14.4127 12.9998 14.8267V17.0477Z" fill="#674d45"></path>
                        </svg>
                        <input onblur="PlaceHolderHandle('login-password' ,'pass-plc' ,'bl')" onfocus="PlaceHolderHandle('login-password' ,'pass-plc' ,'fc')" type="text" name="password" id="login-password">
                        <div class="input-placeholder" id="pass-plc">پسورد خود را وارد کنید</div>
                    </div>
                    <div class="mt-4">
                        <button onclick="Showloader(3000)" id="btn-login" type="submit" class="btn-defIconFlex w-[100%] justify-center gap-1" style="height: 55px; padding-top: 15px;">
                            <svg id="Login" width="24px" height="24px" viewBox="0 0 24 24" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
                                <g id="Iconly/Bulk/Login" stroke="none" stroke-width="1.5" fill="none" fill-rule="evenodd">
                                    <g id="Login" transform="translate(2.500000, 2.000000)" fill="#e5e5e5" fill-rule="nonzero">
                                        <path d="M4.7961874,4.446 C4.7961874,1.995 6.85598286,0 9.38762119,0 L14.4199235,0 C16.9453669,0 19,1.99 19,4.436 L19,15.552 C19,18.004 16.941237,20 14.4095987,20 L9.3772964,20 C6.85185294,20 4.7961874,18.009 4.7961874,15.562 L4.7961874,14.622 L4.7961874,4.446 Z" id="Fill-1" opacity="0.400000006"></path>
                                        <path d="M13.5373964,9.4538 L10.5694888,6.5448 C10.2627441,6.2448 9.76910851,6.2448 9.4633795,6.5468 C9.1586662,6.8488 9.15968191,7.3358 9.46541092,7.6358 L11.0905485,9.2288 L0.782097479,9.2288 C0.350420299,9.2288 8.97060204e-14,9.5738 8.97060204e-14,9.9998 C8.97060204e-14,10.4248 0.350420299,10.7688 0.782097479,10.7688 L11.0905485,10.7688 L9.46541092,12.3628 C9.15968191,12.6628 9.1586662,13.1498 9.4633795,13.4518 C9.61675186,13.6028 9.81684693,13.6788 10.0179577,13.6788 C10.2170371,13.6788 10.4171321,13.6028 10.5694888,13.4538 L13.5373964,10.5448 C13.6846745,10.3998 13.7679628,10.2038 13.7679628,9.9998 C13.7679628,9.7948 13.6846745,9.5988 13.5373964,9.4538" id="Fill-4"></path>
                                    </g>
                                </g>
                            </svg>
                            <div>
                                ورود به پنل
                            </div>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
<script src="{% static 'scripts/main.js' %}"></script>
<script src="{% static 'scripts/account.js' %}"></script>
</html>
