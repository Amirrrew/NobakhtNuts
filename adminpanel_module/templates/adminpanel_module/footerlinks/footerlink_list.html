{% extends 'adminpanel_module/shared/base-admin.html' %}
{% load poll_extras %}

{% block admin_title %}
	فوترلینک ها
{% endblock %}

{% block admin_content %}
    <div class="flex justify-between p-2 pt-6 sticky mt-[-10px] top-[-10px] z-10 bg-[var(--header-bg)] backdrop-filter-[blur(10px)] rounded-xl">
        <div class="flex gap-2 items-start">
            <svg id="Paper" width="35px" height="35px" viewBox="0 0 24 24" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
                <g id="Iconly/Bulk/Paper" stroke="none" stroke-width="1.5" fill="none" fill-rule="evenodd">
                    <g id="Paper" transform="translate(3.500000, 2.000000)" fill="#674d45" fill-rule="nonzero">
                        <path d="M15.3088124,7.021 C14.8573009,7.021 14.2592463,7.011 13.5146485,7.011 C11.6987011,7.011 10.2055449,5.508 10.2055449,3.675 L10.2055449,0.459 C10.2055449,0.206 10.0035529,0 9.75304328,0 L4.4636263,0 C1.99516571,0 0,2.026 0,4.509 L0,15.284 C0,17.889 2.09022075,20 4.66957889,20 L12.5462753,20 C15.0058245,20 17,17.987 17,15.502 L17,7.471 C17,7.217 16.7989982,7.012 16.5474984,7.013 C16.1247015,7.016 15.6177413,7.021 15.3088124,7.021" id="Fill-3" opacity="0.400000006"></path>
                        <path d="M12.584,0.5673 C12.285,0.2563 11.763,0.4703 11.763,0.9013 L11.763,3.5383 C11.763,4.6443 12.674,5.5543 13.78,5.5543 C14.477,5.5623 15.445,5.5643 16.267,5.5623 C16.688,5.5613 16.902,5.0583 16.61,4.7543 C15.555,3.6573 13.666,1.6913 12.584,0.5673" id="Fill-1" opacity="0.400000006"></path>
                        <path d="M10.918,12.8928 C11.329,12.8928 11.663,13.2268 11.663,13.6378 C11.663,14.0488 11.329,14.3818 10.918,14.3818 L5.474,14.3818 C5.063,14.3818 4.73,14.0488 4.73,13.6378 C4.73,13.2268 5.063,12.8928 5.474,12.8928 L10.918,12.8928 Z M8.8589,7.8986 C9.2699,7.8986 9.6039,8.2326 9.6039,8.6436 C9.6039,9.0546 9.2699,9.3876 8.8589,9.3876 L5.4739,9.3876 C5.0629,9.3876 4.7299,9.0546 4.7299,8.6436 C4.7299,8.2326 5.0629,7.8986 5.4739,7.8986 L8.8589,7.8986 Z" id="Combined-Shape"></path>
                    </g>
                </g>
            </svg>
            <h1 class="text-4xl font-semibold">فوترلینک ها</h1>
        </div>
        <div class="flex gap-1 relative">
            <a href="{% url 'admin_footerlink_add' %}" class="btn-defIconFlex2 gap-2">
                <div>لینک جدید</div>
                <i class="fa fa-add mt-1"></i>
            </a>
            <button onclick="OpenFooterBoxAdd()" class="btn-defIconFlex gap-2">
                <div>ردیف جدید</div>
                <i class="fa fa-add mt-1"></i>
            </button>
            <div id="footerbox-input" class="hidden gap-1 absolute p-2 mt-12 w-80 bg-[var(--header-bg)] rounded-xl border border-[var(--color12)] left-0" style="backdrop-filter: blur(10px); z-index: 100; animation: load5 300ms">
                <input id="footerbox-inp" class="input-admin bg-white" placeholder="عنوان ردیف فوتر">
                <button onclick="NewFooterBox()" class="btn-defIconFlex" style="width: 60px; height: 50px; display: block">
                    <i class="fa fa-check mt-1.5"></i>
                </button>
            </div>
        </div>
    </div>
    <div id="footer-link-partial" class="flex flex-wrap w-[100%] gap-2 mt-5 items-start relative">
        {% include 'adminpanel_module/footerlinks/footerlink_partial.html' %}
    </div>
    <script>
        let footerboxinput = document.getElementById('footerbox-input')
        let footerbox_inp = document.getElementById('footerbox-inp')
        let footerlinkpartial = document.getElementById('footer-link-partial')
        function OpenFooterBoxAdd() {
            footerboxinput.classList.replace('hidden', 'flex');

            setTimeout(() => {
                document.addEventListener('click', (e)=> {
                    if (!footerboxinput.contains(e.target)) {
                        footerboxinput.classList.replace('flex', 'hidden');
                    }
                }, { once: true });
            }, 50);
        }

        let NewFooterBox = () => {
            footer_title = footerbox_inp.value
            Showloader(1000)
            fetch('/adminpanel/footerlinks/?title=' + footer_title).then(res => res.json()).then(data => {
                footerlinkpartial.innerHTML = data.html
            }).finally(()=> {
                footerbox_inp.value = ''
                footerboxinput.classList.replace('flex' ,'hidden')
            })
        }
     </script>
{% endblock %}
