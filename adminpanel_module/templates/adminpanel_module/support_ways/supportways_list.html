{% extends 'adminpanel_module/shared/base-admin.html' %}
{% load poll_extras %}

{% block admin_title %}
	راه های ارتباطی
{% endblock %}

{% block admin_content %}
    <div class="flex justify-between p-2 pt-6 sticky mt-[-10px] top-[-10px] z-10 bg-[var(--header-bg)] backdrop-filter-[blur(10px)] rounded-xl">
        <div class="flex gap-2 items-start">
            <svg id="Call" width="34" height="35" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path opacity="0.4" fill-rule="evenodd" clip-rule="evenodd" d="M21.4974 16.4125C18.8594 13.2125 17.5444 13.4995 16.0984 14.2025C15.0974 14.6885 14.2334 15.1105 11.9874 12.8635C9.74141 10.6165 10.1624 9.75354 10.6484 8.75454C11.3534 7.30754 11.6394 5.98954 8.43641 3.35254C7.67341 2.72754 6.84141 2.48754 5.97541 2.65554C4.14241 2.99854 2.84741 5.03854 2.84941 5.03854C2.03741 6.17454 0.925409 9.59054 8.09241 16.7585C12.8064 21.4735 15.8974 22.6045 17.7734 22.6045C18.7504 22.6045 19.3964 22.2985 19.7704 22.0295C19.7914 22.0175 21.8494 20.7425 22.1964 18.8735C22.3584 18.0045 22.1234 17.1775 21.4974 16.4125Z" fill="#674d45"></path>
            </svg>
            <h1 class="text-4xl font-semibold">راه های ارتباطی</h1>
        </div>
        <div>
            <a href="{% url 'admin_supportways_add' %}" class="btn-defIconFlex gap-2">
                <div>راه ارتباطی جدید</div>
                <i class="fa fa-add mt-1"></i>
            </a>
        </div>
    </div>
    <div class="flex flex-wrap w-[100%] gap-2 mt-3 items-start relative">
        {% for sw in supportways %}
            <div id="cat-{{ c.pk }}" class="cat-opt relative bg-[var(--color12)] w-[49.5%] rounded-xl p-2 transition-all hover:bg-[var(--color13)] h-20" style="animation: load5 {% widthratio forloop.counter 1 100 %}ms">
                <div class="flex justify-between">
                    <div class="flex gap-2">
                        <div class="text-center w-15 h-15 rounded-lg bg-[var(--color13)] text-2xl pt-4.5"><i class="{{ sw.icon }} text-[var(--color6)]"></i></div>
                        <div>
                            <h1 class="text-xl mt-2 flex items-start gap-1">{{ sw.title|to_fanum }}</h1>
                            <div class="text-[var(--color10)] text-sm">{{ sw.name }}</div>
                        </div>
                    </div>
                    <div class="flex gap-1">
                        <a href="{% url 'admin_supportways_edit' sw.pk %}"><button class="bg-[var(--color11)] text-[var(--color6)] w-5 h-5 rounded cursor-pointer"><i class="fa fa-pencil text-xs"></i></button></a>
                        <button onclick="OpenDialog('آیا مایل به حذف راه ارتباطی هستید؟' ,'{% url 'admin_supportways_delete' sw.pk %}')" class="bg-[var(--cancel-bg)] text-[var(--loss-bg)] w-5 h-5 rounded cursor-pointer"><i class="fa fa-trash text-xs"></i></button>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
{% endblock %}
