{% load static %}
{% load poll_extras %}
<div class=" centerbox w-[98%] fixed bottom-18" style="z-index: 80">
        <div id="basket-navbar" class="prd-navbar">
            <div onclick="PayNav()" class="btn-prdnavbar flex justify-between w-[100%] p-2 pt-3 items-start">
                <div class="flex gap-2">
                    <svg class="" id="Bank Card" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path opacity="0.4" fill-rule="evenodd" clip-rule="evenodd" d="M2.5 19.6686H22V10.6716H2.5V19.6686Z" fill="#674d45"></path>
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M2.5 9.17164H22V4.60864H2.5V9.17164Z" fill="#674d45"></path>
                        <path d="M19.327 16.2307H14.352V14.7307H19.327V16.2307Z" fill="#674d45"></path>
                        <path d="M12.374 16.2307H10.126V14.7307H12.374V16.2307Z" fill="#674d45"></path>
                    </svg>
                    <div class="">کارت به کارت</div>
                </div>
                <button type="button" class="btn-prdnavbar rounded-lg bg-[var(--color9)] w-6 pt-1 h-6 text-xs cursor-pointer"><i id="btn-navicon" class="fa fa-angle-down"></i></button>
            </div>

            <div class="w-[100%] btn-prdnavbar relative payment-item p-2 border-b border-dashed border-[var(--color10)]">
                <div id="" class="relative btn-prdnavbar flex justify-between w-[100%] items-start">
                    <div class="flex gap-2">
                        <svg id="Wallet" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path opacity="0.4" fill-rule="evenodd" clip-rule="evenodd" d="M17.5207 15.1719C15.6937 15.1719 14.2077 13.6859 14.2077 11.8599C14.2077 10.0329 15.6937 8.54594 17.5207 8.54594H21.7307C20.8527 4.49194 18.0597 2.96094 12.2507 2.96094C5.01471 2.96094 2.44971 5.32694 2.44971 11.9999C2.44971 18.6739 5.01471 21.0389 12.2507 21.0389C18.1927 21.0389 20.9807 19.4389 21.7887 15.1719H17.5207Z" fill="#674d45"></path>
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M11.9017 8.64099H7.84167C7.42767 8.64099 7.09167 8.30499 7.09167 7.89099C7.09167 7.47699 7.42767 7.14099 7.84167 7.14099H11.9017C12.3157 7.14099 12.6517 7.47699 12.6517 7.89099C12.6517 8.30499 12.3157 8.64099 11.9017 8.64099Z" fill="#674d45"></path>
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M17.5205 13.6719C16.5215 13.6719 15.7075 12.8589 15.7075 11.8599C15.7075 10.8599 16.5215 10.0459 17.5205 10.0459H21.9565C22.0155 10.6549 22.0505 11.2979 22.0505 11.9999C22.0505 12.5949 22.0225 13.1439 21.9805 13.6719H17.5205ZM18.4106 11.7998C18.4106 12.2138 18.0746 12.5498 17.6606 12.5498C17.2466 12.5498 16.9106 12.2138 16.9106 11.7998C16.9106 11.3858 17.2466 11.0498 17.6606 11.0498C18.0746 11.0498 18.4106 11.3858 18.4106 11.7998Z" fill="#674d45"></path>
                        </svg>
                        <div class="">{{ card.owner }}</div>
                    </div>
                    <div class="flex gap-1">
                        <div>{{ card.card_code|format_card_number }}</div>
                        <div>
                            <i onclick="CopyToClipboard('clipboard-card-m' ,'check-card-m' ,'{{ card.card_code }}')" class="fa fa-copy cursor-pointer text-[var(--color10)] mt-0.5 relative" id="clipboard-card-m"></i>
                            <i class="fa fa-check text-[var(--color10)] mt-0.5" style="display: none; animation: load3 200ms; position: relative" id="check-card-m"></i>
                        </div>
                    </div>
                </div>
                <div class="mt-2 payment-item">
                    {% if card.shaba %}
                        <div class="flex w-[100%] justify-end gap-2">
                            <div><span class="text-[var(--color10)]">IR </span>{{ card.shaba|to_fanum }}</div>
                            <div class="">
                                <i onclick="CopyToClipboard('clipboard-shaba-m' ,'check-shaba-m' ,'{{ card.shaba }}')" class="fa fa-copy cursor-pointer text-[var(--color10)] mt-0.5 relative" id="clipboard-shaba-m"></i>
                                <i class="fa fa-check text-[var(--color10)] mt-0.5" style="display: none; animation: load3 200ms; position: relative" id="check-shaba-m"></i>
                            </div>
                        </div>
                    {% endif %}
                </div>
            </div>



            <div class="flex justify-between pt-2">
                <div class="text-[var(--color6)] mt-0.5">مجموع به ریال:</div>
                <div class="flex gap-1">
                    <div class="text-2xl relative" style="animation: load 300ms">{{ total_amount|three_digits_currency_rials }}</div>
                    <div class="mt-1 ml-2">
                        <i onclick="CopyToClipboard('clipboard-price-m' ,'check-price-m' ,'{{ total_amount }}')" class="fa fa-copy cursor-pointer text-[var(--color10)] mt-0.5 relative" id="clipboard-price-m"></i>
                        <i class="fa fa-check text-[var(--color10)] mt-0.5" style="display: none; animation: load3 200ms; position: relative" id="check-price-m"></i>
                    </div>
                </div>
            </div>

            <div class="flex gap-1 mt-2">
                <a style="width: 100%" href="{% url 'checkout_page' %}">
                    <button name="order" type="submit" style="width: 100%; height: 50px; padding-top: 13px; justify-content: center" class="btn-defIconFlex gap-1">
                        <svg class="mt-[-2px]" id="Tick Square" width="24" height="25" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path opacity="0.4" fill-rule="evenodd" clip-rule="evenodd" d="M12.25 2.78467C5.052 2.78467 2.5 5.33667 2.5 12.5347C2.5 19.7327 5.052 22.2847 12.25 22.2847C19.448 22.2847 22 19.7327 22 12.5347C22 5.33667 19.448 2.78467 12.25 2.78467Z" fill="#c5b8b4"></path>
                            <path d="M11.5912 15.4375L16.3412 10.6915C16.6342 10.3985 16.6342 9.92351 16.3412 9.63051C16.0482 9.33851 15.5732 9.33751 15.2802 9.63051L11.0612 13.8465L9.2202 12.0035C8.9282 11.7125 8.4532 11.7105 8.1592 12.0035C7.8662 12.2965 7.8662 12.7715 8.1592 13.0645L10.5302 15.4375C10.6712 15.5785 10.8622 15.6575 11.0612 15.6575C11.2602 15.6575 11.4502 15.5785 11.5912 15.4375Z" fill="#c5b8b4"></path>
                        </svg>
                        <div>پرداخت کردم</div>
                    </button>
                </a>
            </div>
        </div>
    </div>
