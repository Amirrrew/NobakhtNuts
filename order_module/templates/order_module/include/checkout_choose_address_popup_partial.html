{% load static %}
{% load poll_extras %}

{% if my_address %}
     <div id="address-popup">
    {% for address in my_address %}
            <input type="radio" name="address" id="{{ address.id }}" value="{{ address.id }}" {% if orders.address == address %}checked{% endif %} hidden />
            <label class="address-check flex items-center w-[100%] justify-between bg-[var(--color12)] text-[var(--color6)] cursor-pointer rounded-2xl mt-2 relative transition-all" style="border: {% if not orders.address == address %}2px solid rgba(161,153,153,0.1){% else %}3px solid var(--color6){% endif %}; background-color: rgba(228,218,218,0.29);" for="{{ address.id }}">
                <div onclick="SetOrderAddress('{{ address.id }}')" class="flex gap-2 p-3 h-[100%] w-[100%] items-start" style="z-index: 40">
                    <div class="address-checked transition-all centerbox items-center rounded-xl w-10 h-10 mt-4 bg-[var(--color9)]">
                        <div class="address-checked-icon text-[var(--color14)] mt-1"><i class="fa fa-check"></i></div>
                        <div class="address-unchecked-icon text-[var(--color10)] mt-1"><i class="fa fa-circle"></i></div>
                    </div>
                    <div>
                        <div class="text-[var(--color6)] font-bold">{{ address.title|to_fanum }} ،{{ address.receiver }}</div>
                        <div>{{ address.province|to_fanum }} ,{{ address.city|to_fanum }}</div>
                        <div class="text-[var(--color7)]">{{ address.details|to_fanum }}</div>
                    </div>
                </div>
                <div class="h-[100%] gap-3 p-3 centerbox items-center">
                    <i class="fa fa-edit" style="z-index: 50" onclick="PopUpEditAddress('{{ address.id }}' ,'open')"></i>
                    <i onclick="SetOrderAddress('{{ address.id }}')" class="fa fa-angle-left"></i>
                </div>
            </label>
    {% endfor %}
     </div>
    {% else %}
    <div class="text-center mt-6 text-[var(--color6)]">
        <div class="centerbox"><img src="{% static 'media/icons/no-location.webp' %}" class="w-[120px]"></div>
        <p class="text-xl font-bold mt-5">شما آدرسی ندارید!</p>
        <p class="px-10">برای ارسال سفارش نیاز است یک آدرس ثبت کنید.لطفا اطلاعات را بصورت دقیق وارد نمایید.</p>
    </div>
{% endif %}
