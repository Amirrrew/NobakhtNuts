{% load static %}
{% load poll_extras %}

{% if my_address %}
     <div id="address-popup">
    {% for address in my_address %}
            <input onclick="SetOrderAddress('{{ address.id }}')" type="radio" name="address" id="{{ address.id }}" value="{{ address.id }}" {% if orders.address == address %}checked{% endif %} hidden />
            <label class="address-check gap-2 flex items-center w-[100%] justify-between bg-[var(--color12)] text-[var(--color6)] cursor-pointer p-3 rounded-2xl mt-2 relative transition-all" style="border: {% if not orders.address == address %}2px solid rgba(161,153,153,0.1){% else %}3px solid var(--color6){% endif %}; background-color: rgba(228,218,218,0.29);" for="{{ address.id }}">
                <div class="flex gap-2 items-start">
                    <div class="address-checked transition-all centerbox items-center rounded-xl w-10 h-10 mt-4 bg-[var(--color9)]">
                        <div class="address-checked-icon text-[var(--color14)] mt-1"><i class="fa fa-check"></i></div>
                        <div class="address-unchecked-icon text-[var(--color10)] mt-1"><i class="fa fa-circle"></i></div>
                    </div>
                    <div>
                        <div class="text-[var(--color6)] font-bold">{{ address.title|to_fanum }} ،{{ address.receiver }}</div>
                        <div>{{ address.province|to_fanum }} ,{{ address.city|to_fanum }}</div>
                        <div class="text-[var(--color7)]">{{ address.details|to_fanum }}</div>
                    </div>
                </div>
                <div class="h-[100%] gap-3 centerbox items-center">
{#                    <i class="fa fa-edit"></i>#}
                    <i class="fa fa-angle-left"></i>
                </div>
            </label>
    {% endfor %}
     </div>
{% endif %}
