{% load static %}
{% load poll_extras %}
                <div class="basket-total w-[400px] min-h-[290px] bg-[var(--color12)] rounded-2xl p-4 relative mt-2">
                    <div class="flex gap-2 pt-2">
                        <div class="text-nowrap">تعداد اقلام سبد خرید</div>
                        <div class="w-[100%] mt-2.5" style="border-top: 1px dashed var(--color10);"></div>
                        <div class="text-2xl mt-[-4px]">{{ total_items|to_fanum }}</div>
                    </div>
                    <div class="flex gap-2 pt-2">
                        <div class="text-nowrap">وزن کل سفارش</div>
                        <div class="w-[100%] mt-2.5" style="border-top: 1px dashed var(--color10);"></div>
                        <div class="text-nowrap mt-[-4px]">{{ total_weight|to_fanum }} کیلو</div>
                    </div>
                    <div class="mt-2">
                        <div class="text-[var(--color10)] border-t border-dashed border-[var(--color11)] pt-2 mt-2">مجموع سبد خرید</div>
                        <div class="text-3xl relative" style="animation: load 300ms">{{ total_amount|three_digits_currency }}</div>
                    </div>
                    <div class="text-2xl text-[var(--color6)]"></div>
