{% load poll_extras %}
                    {% if my_address %}
                        {% for address in my_address %}
                            <input type="radio" name="address" id="{{ address.id }}" value="{{ address.id }}" {% if forloop.first %}checked{% endif %} hidden>
                            <label class="address-check flex items-start w-[100%] gap-2 bg-[var(--color12)] text-[var(--color6)] cursor-pointer border-2 border-[var(--color13)] p-3 rounded-2xl mt-2 relative transition-all" style="animation: load {% widthratio forloop.counter 1 300 %}ms; background-color: var(--color19)" for="{{ address.id }}">
                                <div class="address-checked transition-all centerbox items-center rounded-xl w-10 h-10 mt-4 bg-[var(--color9)]">
                                    <div class="address-checked-icon text-[var(--color14)] mt-1"><i class="fa fa-check"></i></div>
                                    <div class="address-unchecked-icon text-[var(--color10)] mt-1"><i class="fa fa-circle"></i></div>
                                </div>
                                <div>
                                    <div class="text-[var(--color10)]">{{ address.title|to_fanum }} ،{{ address.receiver }}</div>
                                    <div>{{ address.province|to_fanum }} ,{{ address.city|to_fanum }}</div>
                                    <div>{{ address.details|to_fanum }}</div>
                                </div>
                            </label>
                        {% endfor %}
                        {% else %}
                        <div class="centerbox text-center mt-10">
                            <div>
                                <div class="text-xl">
                                    شما آدرسی ندارید!
                                </div>
                                <div class="mt-1 max-w-100 text-[var(--color10)]">
                                    برای ارسال سفارش، شما باید یک آدرس ثبت کنید.
                                    <b class="text-[var(--color7)]">توجه داشته باشید که آدرس را به درستی ثبت کنید، در غیر این صورت مسئولیت ثبت اشتباه آدرس با خودتان است.</b>
                                </div>
                                <div class="centerbox mt-3">
                                    <button type="button" onclick="PopUp('address' ,'open')" class="btn-defIconFlex mt-[-7px] gap-2">
                                        <svg class="mt-[-1px]" id="Plus" width="24" height="25" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <path opacity="0.4" fill-rule="evenodd" clip-rule="evenodd" d="M12.2499 2.29761C4.69094 2.29761 2.01294 4.97561 2.01294 12.5346C2.01294 20.0936 4.69094 22.7716 12.2499 22.7716C19.8079 22.7716 22.4869 20.0936 22.4869 12.5346C22.4869 4.97561 19.8079 2.29761 12.2499 2.29761Z" fill="#c5b8b4"></path>
                                        <path d="M12.9996 13.2847H15.8276C16.2416 13.2847 16.5776 12.9487 16.5776 12.5347C16.5776 12.1207 16.2416 11.7847 15.8276 11.7847H12.9996V8.96069C12.9996 8.54669 12.6636 8.21069 12.2496 8.21069C11.8356 8.21069 11.4996 8.54669 11.4996 8.96069V11.7847H8.67163C8.25763 11.7847 7.92163 12.1207 7.92163 12.5347C7.92163 12.9487 8.25763 13.2847 8.67163 13.2847H11.4996V16.1087C11.4996 16.5227 11.8356 16.8587 12.2496 16.8587C12.6636 16.8587 12.9996 16.5227 12.9996 16.1087V13.2847Z" fill="#c5b8b4"></path>
                                        </svg>
                                        <div>
                                            ثبت آدرس جدید
                                        </div>
                                    </button>
                                </div>
                            </div>
                        </div>
                    {% endif %}
