{% load static %}
{% load poll_extras %}

{% if product.features.all %}
    <div class="mt-20" id="full-features">
        <div class="comment-titlebar flex w-[100%] justify-between border-b border-[var(--color9)] pb-3">
            <div class="flex gap-2 mt-1">
                    <svg id="More Circle" width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path opacity="0.4" fill-rule="evenodd" clip-rule="evenodd" d="M12.25 2.78467C5.051 2.78467 2.5 5.33567 2.5 12.5347C2.5 19.7327 5.051 22.2847 12.25 22.2847C19.449 22.2847 22 19.7327 22 12.5347C22 5.33567 19.449 2.78467 12.25 2.78467Z" fill="#674d45"></path>
                    <path d="M14.4592 14.4346C14.4592 14.9876 14.9112 15.4346 15.4632 15.4346C16.0152 15.4346 16.4632 14.9876 16.4632 14.4346C16.4632 13.8816 16.0152 13.4346 15.4632 13.4346H15.4542C14.9022 13.4346 14.4592 13.8816 14.4592 14.4346Z" fill="#674d45"></path>
                    <path d="M11.4592 10.4346C11.4592 10.9876 11.9112 11.4346 12.4632 11.4346C13.0152 11.4346 13.4632 10.9876 13.4632 10.4346C13.4632 9.88157 13.0152 9.43457 12.4632 9.43457H12.4542C11.9022 9.43457 11.4592 9.88157 11.4592 10.4346Z" fill="#674d45"></path>
                    <path d="M8.4502 14.4346C8.4502 14.9876 8.9032 15.4346 9.4552 15.4346C10.0072 15.4346 10.4552 14.9876 10.4552 14.4346C10.4552 13.8816 10.0072 13.4346 9.4552 13.4346H9.4462C8.8942 13.4346 8.4502 13.8816 8.4502 14.4346Z" fill="#674d45"></path>
                    </svg>
                <div class="font-black text-2xl mt-1">مشخصات کامل</div>
            </div>
        </div>
        <table class="tb-features w-[100%]">
            <thead class="text-[var(--color10)] text-lg">
                <tr>
                    <td>مشخصه</td>
                    <td>توضیحات</td>
                </tr>
            </thead>
            <tbody class="border-t border-[var(--color12)]">
                {% for spec in product.features.all %}
                	<tr>
                        <td>{{ spec.title }}</td>
                        <td>{{ spec.desc|to_fanum }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endif %}
