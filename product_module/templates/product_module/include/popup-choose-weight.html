{% load static %}
{% load poll_extras %}

<div id="popup-parent-weight" class="popup-parent">
    <div id="popup-form-weight" class="popup-form-inventory form-default">
        <div class="hidden popup-closer">
            <div class="h-1 mt-1 w-10 bg-[var(--color14)] rounded-2xl">
            </div>
        </div>
        <div class="flex justify-between p-5">
            <div class="flex gap-3 ">
                <img style="min-width: 40px; max-width: 40px; height: 40px" class="mt-1" src="{% static 'media/icons/package.webp' %}" alt="package-icon">
                <div id="form-title" class="text-5xl mt-1 font-bold">
                    وزن بسته
                </div>
            </div>
            <button onclick="PopUpWeight('none' ,'close')" class="btn-icon2" style="color: #d1c1bd; width: 40px; height: 40px; padding-right: 8px">
                <svg id="Close Square" width="24" height="25" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path opacity="0.4" fill-rule="evenodd" clip-rule="evenodd" d="M12.25 2.78467C5.052 2.78467 2.5 5.33667 2.5 12.5347C2.5 19.7327 5.052 22.2847 12.25 22.2847C19.449 22.2847 22 19.7327 22 12.5347C22 5.33667 19.449 2.78467 12.25 2.78467Z" fill="#c5b8b4"></path>
                <path d="M14.6504 15.6777C14.8424 15.6777 15.0344 15.6037 15.1804 15.4577C15.4734 15.1647 15.4734 14.6897 15.1804 14.3967L13.3064 12.5237L15.1694 10.6597C15.4624 10.3667 15.4624 9.89268 15.1694 9.59968C14.8764 9.30668 14.4024 9.30668 14.1094 9.59968L12.2454 11.4637L10.3794 9.59768C10.0864 9.30468 9.61236 9.30468 9.31936 9.59768C9.02636 9.89068 9.02636 10.3647 9.31936 10.6577L11.1854 12.5237L9.31936 14.3917C9.02636 14.6847 9.02636 15.1587 9.31936 15.4517C9.46536 15.5987 9.65836 15.6717 9.84936 15.6717C10.0414 15.6717 10.2334 15.5987 10.3794 15.4517L12.2464 13.5847L14.1194 15.4577C14.2664 15.6037 14.4574 15.6777 14.6504 15.6777Z" fill="#c5b8b4"></path>
                </svg>
            </button>
        </div>


        <div id="pack-weights" style="margin-bottom: 20px" class="px-4 transition-all">
            {% for pack in product.packs.all %}
                <div onclick="AddToOrder('{{ product.id }}','{% if product.is_byWeight %}true{% else %}false{% endif %}' ,'{{ pack.id }}')" class="w-[100%] block gap-2 p-2 mt-2 cursor-pointer rounded-xl flex {% if product.quantity < pack.size %}disabled{% endif %}" style="background-color: rgba(228,218,218,0.5);">
                    <div class="w-12 h-12 min-h-12 min-w-12 centerbox items-center bg-[var(--color17)] rounded-xl">
                        <img loading="eager" class="w-[80%]" src="{% if pack.icon %}{{ pack.icon.url }}{% else %}{% static 'media/icons/package.webp' %}{% endif %}" alt="{{ pack.title }}">
                    </div>
                    <div class="flex justify-between gap-2 w-[100%]">
                        <div>
                            <div class="flex items-start gap-1"><div class="text-sm text-[var(--color7)]">بسته {{ pack.title|to_fanum }}</div>{% if product.quantity < pack.size %}<div class="bg-[var(--del-bg)] text-[var(--deny-text)] px-1 text-sm rounded-lg">ناموجود</div>{% endif %}</div>
                            <div class="font-bold text-xl mt-0.5">{{ product.final_price|pack_price:pack.size|three_digits_currency }}</div>
                        </div>
                        <div class="centerbox items-center">
                            <i class="fa fa-angle-left ml-2"></i>
                        </div>
                    </div>
                </div>
            {% endfor %}
            <div onclick="PopUpGuide('none' ,'open')" class="mt-3 font-semibold flex justify-between rounded-xl p-2 cursor-pointer" style="background-color: rgba(209,182,182,0.17);">
                <div class="flex gap-1">
                    <i class="fa fa-question-circle mt-1 text-sm text-[var(--color6)]"></i>
                    <div class="hover-underline">
                        مقدار بیشتر میخوام
                    </div>
                </div>
                <i class="fa fa-external-link fa-xs mt-2.5"></i>
            </div>
        </div>
    </div>
</div>
