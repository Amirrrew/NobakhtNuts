<div class="swiper category-carousel mt-5" id="category-carousel" style="overflow-y: visible !important;">
    <div class="swiper-wrapper h-20" style="height: 170px;">
        {% for cat in category %}
            <a href="{{ cat.get_absolute_url }}" class="swiper-slide h-30 relative" style="display: block">
                <div class="centerbox transition-all items-center rounded-4xl h-30 w-30 bg-[var(--color12)] hover:bg-[var(--color13)]"><h5 class="text-5xl mt-2">{{ cat.emoji }}</h5></div>
                <h3 class="text-center w-30 mt-2">{{ cat.title }}</h3>
            </a>
        {% endfor %}
    </div>
