    <script>
            const swiperrelated = new Swiper("#swiper-prdrelated", {
                observer: true,
                observeParents: true,
            slidesPerView: 4.5,
            spaceBetween: 10,

            navigation: {
                nextEl: "#swiper-button-next",
                prevEl: "#swiper-button-prev",
            },


            breakpoints: {
                100: {
                    slidesPerView: 1.1
                },
                400: {
                    slidesPerView: 1.1
                },
                520: {
                    slidesPerView: 1.5
                },
                700: {
                    slidesPerView: 1.5
                },
                900: {
                    slidesPerView: 2.2
                },
                1300: {
                    slidesPerView: 3.1,
                },
                1500: {
                    slidesPerView: 3.5
                }
            },
        });

            window.addEventListener('load', () => {
    swiperrelated.update();
    swiperrelated.navigation.init();
    swiperrelated.navigation.update();
    });
    </script>
