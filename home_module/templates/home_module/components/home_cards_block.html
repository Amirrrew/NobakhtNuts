    <div class="swiper card-block mt-3" id="card-block">
        <div class="swiper-wrapper" style="height: 150px">
            {% for card in card_block.cardblock_set.all %}
                <a href="{{ card.category.get_absolute_url }}" class="swiper-slide home-card">
                    <div class="h-[100%] flex justify-between items-center mr-10">
                        <div>
                            <h3 class="text-3xl home-card-title font-semibold">{{ card.category.title }}</h3>
                            <p class="text-[var(--color10)] mt-1"> شامل {{ card.category.products.count|to_fanum }} محصول</p>
                        </div>
                        <div class="w-[50%] home-card-imgbox absolute bottom-0 left-0">
                            <img class="w-[100%] home-card-img" alt="{{ card.category.title }}" loading="eager" src="{% if card.cover %}{{ card.cover.url }}{% endif %}">
                        </div>
                    </div>
                </a>
            {% endfor %}
        </div>
    </div>
</div>
