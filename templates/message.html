{% load static %}

{% if message %}
    <div class="centerbox">
        <div class="message-box" id="message">
            <div class="flex gap-2">
                <div class="event-bar-logo">
                    <svg id="Tick Square" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path opacity="0.4" fill-rule="evenodd" clip-rule="evenodd" d="M12.25 2.78467C5.052 2.78467 2.5 5.33667 2.5 12.5347C2.5 19.7327 5.052 22.2847 12.25 22.2847C19.448 22.2847 22 19.7327 22 12.5347C22 5.33667 19.448 2.78467 12.25 2.78467Z" fill="#674d45"></path>
                        <path d="M11.5912 15.4375L16.3412 10.6915C16.6342 10.3985 16.6342 9.92351 16.3412 9.63051C16.0482 9.33851 15.5732 9.33751 15.2802 9.63051L11.0612 13.8465L9.2202 12.0035C8.9282 11.7125 8.4532 11.7105 8.1592 12.0035C7.8662 12.2965 7.8662 12.7715 8.1592 13.0645L10.5302 15.4375C10.6712 15.5785 10.8622 15.6575 11.0612 15.6575C11.2602 15.6575 11.4502 15.5785 11.5912 15.4375Z" fill="#674d45"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="font-semibold mt-1">موفقیت!</h1>
                    <h1 class="mt-[-5px] text-[var(--color10)]">{{ message }}</h1>
                </div>
            </div>
            <div onclick="document.getElementById('message').style.animation = 'none' ,document.getElementById('message-time').style.animation = 'none'" class="flex z-20 rounded-[30px] p-4 px-5 gap-6 cursor-pointer">
                <i class="fa fa-close"></i>
            </div>
            <div class="message-timebar"><div class="message-time" id="message-time"></div></div>
        </div>
    </div>


    <script>

            let message = document.getElementById('message')
            let message_time = document.getElementById('message-time')

            if (window.innerWidth > 1130) {
                message.style.animation = "Showmessage_desktop 4s"
            } else {
                message.style.animation = "Showmessage_mobile 4s"
            }
            message_time.style.animation = "ShowmessageTime 4s"
            setTimeout(() => {
                message_time.style.animation = "none"
                message.style.animation = "animation: none; top: -300px;"
            } ,4000)



        </script>

    {% elif message_e %}
    <div class="centerbox">
        <div class="message-box" id="message">
            <div class="flex gap-2">
                <div class="event-bar-logo">
                    <svg id="Danger" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path opacity="0.4" fill-rule="evenodd" clip-rule="evenodd" d="M19.3101 10.6927L19.0981 10.3187C16.1121 5.00867 14.2561 3.03467 12.2501 3.03467C10.2441 3.03467 8.38808 5.00867 5.40208 10.3187L5.19108 10.6927C4.11808 12.5747 1.88808 16.4897 2.30208 18.8257C2.79008 21.5887 5.63508 22.0347 12.2501 22.0347C18.8661 22.0347 21.7111 21.5887 22.1981 18.8257C22.6121 16.4897 20.3821 12.5747 19.3101 10.6927Z" fill="#674d45"></path>
                    <path d="M11.5005 16.4297C11.5005 16.8437 11.8405 17.1797 12.2545 17.1797C12.6685 17.1797 13.0045 16.8437 13.0045 16.4297C13.0045 16.0157 12.6685 15.6797 12.2545 15.6797H12.2455C11.8315 15.6797 11.5005 16.0157 11.5005 16.4297Z" fill="#674d45"></path>
                    <path d="M12.2495 8.28467C11.8355 8.28467 11.4995 8.62067 11.4995 9.03467V12.9297C11.4995 13.3437 11.8355 13.6797 12.2495 13.6797C12.6635 13.6797 12.9995 13.3437 12.9995 12.9297V9.03467C12.9995 8.62067 12.6635 8.28467 12.2495 8.28467Z" fill="#674d45"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="font-semibold mt-1">خطا!</h1>
                    <h1 class="mt-[-4px] text-[var(--color10)]">{{ message_e }}</h1>
                </div>
            </div>
            <div onclick="document.getElementById('message').style.animation = 'none' ,document.getElementById('message-time').style.animation = 'none'" class="flex z-20 rounded-[30px] p-4 px-5 gap-6 cursor-pointer">
                <i class="fa fa-close"></i>
            </div>
            <div class="message-timebar"><div class="message-time" id="message-time"></div></div>
        </div>
    </div>


    <script>

            let message = document.getElementById('message')
            let message_time = document.getElementById('message-time')

            if (window.innerWidth > 1130) {
                message.style.animation = "Showmessage-e-desktop 4s"
            } else {
                message.style.animation = "Showmessage-e-mobile 4s"
            }
            message_time.style.animation = "ShowmessageTime 4s"
            setTimeout(() => {
                message_time.style.animation = "none"
                message.style.animation = "animation: none; top: -300px;"
            } ,4000)



        </script>

{% endif %}
