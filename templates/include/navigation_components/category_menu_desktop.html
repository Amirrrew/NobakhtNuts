{% load poll_extras %}

<div class="category-menu hidden" id="category-menu">
    <ul class="category-menu-bar">
        <li class="{% if not forloop.last %}border-b border-[var(--color13)]{% endif %}">
            <a class="menu-cat-title" href="{% url 'all_products_page' %}">
                <div class="flex gap-2">
                    <h2 class="mt-1">همه محصولات</h2>
                </div>
                <i class="fa fa-angle-left text-sm mt-2"></i>
            </a>
        </li>
    {% for cat in category %}
        <li>
            <a onmouseenter="ShowSubmenu({{ cat.id }})" data-id="{{ cat.id }}" href="{{ cat.get_absolute_url }}" class="menu-cat-title {% if not forloop.last %}border-b border-[var(--color13)]{% endif %}">
                <div class="flex gap-2">
                    <div class="menu-emoji">{{ cat.emoji }}</div>
                    <h2 class="mt-0.5">{{ cat.title }}</h2>
                </div>
                <i class="fa fa-angle-left text-sm mt-2"></i>
            </a>
        </li>
        {% endfor %}
    </ul>
    <ul class="mt-3 mr-4 w-[100%]" id="submenu-panel">
        {% for cat in category %}
            <div style="{% if not forloop.first %}display: none;{% endif %}" class="submenu-panel" id="submenu-{{ cat.id }}">
            {% for sub in cat.subcategory.all %}
                <li><a style="animation: load8 {% widthratio forloop.counter 1 100 %}ms;" class="relative w-[45%] my-2 transition-all duration-200 hover:transform-[translateX(-10px)]" href="{{ sub.get_absolute_url }}">{{ sub.title }}</a></li>
            {% endfor %}
            </div>
        {% endfor %}
    </ul>
    <i onclick="CategoryMenu(false)" class="fa fa-close text-sm absolute top-3 left-3 p-2 rounded-xl cursor-pointer transition-all hover:bg-[var(--color12)]"></i>
</div>
