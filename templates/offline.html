<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اتصال اینترنت برقرار نیست!</title>
</head>
<style>
    .centerbox {
        display: flex;
        justify-content: center;
    }

    @font-face {
        font-family: rokh;
        src: url(../static/font/Rokh-Medium.ttf);
    }

    body {
        font-family: rokh;
        overflow: hidden;
    }


    :root {
    /* --light-text-color: #2a3b82;
    --light-back-color: rgb(230, 248, 255); */
    --color1: #fff;
    --color2: #342929;
    --color3: #ffffff;
    --color4: #d2bab24b;
    --color5: rgb(173, 85, 85);
    --color6: #674d45;
    --color7: #a08a83;
    --color8:#c3a0a02b;
    --color9:#a98e8e3d;
    --color10: #a08a83c7;
    --color11: rgba(234, 228, 228, 0.78);
    --color12: rgba(246, 243, 243, 0.78);
    --color13: rgba(241, 238, 238, 0.78);
    --color14: #C2B8B5;
    --color15: #f3efef;
    --color16: rgba(246, 241, 241, 0.89);
    --color17: rgba(198, 175, 175, 0.15);
    --color18: rgb(250, 246, 246);
    --header-bg: rgba(255, 255, 255, 0.78);
    --border: #3a3a3a31;
    --dot-near:#674d45;
    --dot-far:#a08a83c7;
    --bg:#f6f2ef;
    --ink:#674d45;
    --ink-soft:#a08a83;
    --box-border:#d8cdc7;
    --box-border-active:#674d45;
    --error:#c0392b;
    --error-bg:#fdecea;
    --del-bg: #f1aaaa;
    --deny-text: #731919;
    --cancel-bg: rgba(255, 1, 1, 0.11);
}

    .btn-defIconFlex {
        border-radius: 10px;
        background-color: var(--color6);
        color: var(--color3);
        transition: 200ms;
        cursor: pointer;
        display: flex;
        text-align: center;
        padding: 8px 10px;
        font-family: rokh;
        font-size: 20px;
        height: 50px;
    }

    .btn-defIconFlex:hover {
        background-color: var(--color2);
    }

    .btn-defIconFlex:active {
        filter: blur(3px);
        transform: scale(95%);
        background-color: var(--color10);
    }
</style>
<body>
    <div class="centerbox" style="align-items: center; margin-top: 100px">
        <div>
            <div class="centerbox">
                <img style="width: 250px" alt="اتصال برقرار نیست" src="../static/media/icons/no-connection.webp">
            </div>
            <div class="" style="margin-top: 30px">
                <h1>اتصال اینترنت برقرار نیست</h1>
            </div>
            <div class="centerbox">
                <button onclick="location.reload()" class="btn-defIconFlex">
                    تلاش دوباره
                </button>
            </div>
        </div>
    </div>
</body>
</html>
